    <main>
        <h2>For inquiries</h2>
        <p>Please fill in the form below. We will respond within 24 hours.</p>
        <form id="inquiry-form" novalidate>
            <div class="form-group">
                <label for="inq-fname">First name *</label>
                <input type="text" id="inq-fname" name="fname" required minlength="2" />
                <span class="error-msg" id="inq-fname-error"></span>
            </div>
            <div class="form-group">
                <label for="inq-lname">Last name *</label>
                <input type="text" id="inq-lname" name="lname" required minlength="2" />
                <span class="error-msg" id="inq-lname-error"></span>
            </div>
            <div class="form-group">
                <label for="inq-email">Email *</label>
                <input type="email" id="inq-email" name="email" required />
                <span class="error-msg" id="inq-email-error"></span>
            </div>
            <div class="form-group">
                <label for="inq-type">Inquiry type</label>
                <select id="inq-type" name="type">
                    <option value="product">Product question</option>
                    <option value="volunteer">Volunteering</option>
                    <option value="sponsor">Sponsorship</option>
                    <option value="other">Other</option>
                </select>
            </div>
            <div class="form-group">
                <label for="inq-message">Message *</label>
                <textarea id="inq-message" name="message" required minlength="10"></textarea>
                <span class="error-msg" id="inq-message-error"></span>
            </div>
            <button type="submit">Submit Inquiry</button>
            <div id="inq-form-feedback" class="form-feedback"></div>
        </form>
    </main>
